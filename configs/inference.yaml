# M2: daily statistic + start-day inference on simulated machines (DEV split).
seed: 23
experiment: inference_m2
output_dir: results/inference
split: dev             # dev | test; alarm thresholds are only ever set on dev machines
workers: 5             # capped at 6

detectors:             # produced by: slowburn detector configs/detector.yaml
  lgbm_base: results/detector/detector_base.pkl
  lgbm_validity: results/detector/detector_validity.pkl
timing_config: configs/discovery.yaml          # start prior sweep (P(attack within window))

warmup_days: 14        # days assumed clean, used to fit the benign (null) model
alpha: 0.05            # type-conditional conformal level defining an "exceedance"
fa_targets: [0.01, 0.05, 0.1]   # target ever-alarm rates on attack-free dev machines

statistics:            # daily statistic -> observation model
  exceed: {aggregator: exceed, model: betabinom}
  trimmed_mean: {aggregator: trimmed_mean, model: gaussian_weekday}

inference_models: [single_cp, bocpd, single_cp_uniform, prior_only]

scenario:
  n_files: 40
  file_types: [txt, csv, bin, docx, zip, png, jpg, mp3, zlib, lzma]
  file_kib: [16, 96]
  edits_per_day: 4.0
  attack_start: 30
  attack_files_per_day: 0.5       # slow: one file every ~2 days on average
  damage_model: striped

sweep:
  damage_fraction: [0.05, 0.1, 0.25, 0.5, 1.0]
  # which files the attacker damages: all types, or only high-entropy (hardest for the detector)
  attack_target_types:
    - all
    - [docx, zip, png, jpg, mp3, zlib, lzma]

discovery_delay: [3, 7, 14, 21, 30]
headline_delay: 14
reps: 32
clean_reps: 200        # attack-free machines; 200 so a 1% ever-alarm threshold is estimable

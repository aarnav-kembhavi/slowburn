# D67: the detector of configs/detector.yaml, unchanged model and variants, trained and evaluated on
# NapierOne (real benign files, real encrypted bytes) with the fixed D67 splits (seed 202).
seed: 11
experiment: detector_napierone
output_dir: results/detector_napierone

data:
  benign_source: napierone          # D67 per-type splits 50/20/30 (files_per_type, split unused)
  damage_source: napierone          # D67 family splits 18/6/6
  napierone_dir: data/napierone
  file_types: [txt, csv, bin, docx, zip, png, jpg, mp3, zlib]   # no NapierOne lzma (D67)
  files_per_type: 150
  file_kib: [16, 128]
  chunk_size: 4096
  min_chunk_bytes: 2048             # drop short file tails (chi2 / histogram are noisy there)
  max_chunks_per_file: 12           # stop large files dominating a type
  split: {train: 0.6, calib: 0.2, test: 0.2}   # by FILE, stratified by type
  damage_models: [whole, striped]
  fractions: [1.0, 0.5, 0.25, 0.1, 0.05]
  stripe_bytes: 16

variants: [base, validity, validity_rule]
default_variant: validity      # saved as detector.pkl for downstream experiments

model:
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  class_weight: balanced

calibration:
  conformal_alphas: [0.01, 0.05, 0.1]

eval:
  type_weights: uniform   # explicit per-type weights for WAVG_* rows; or a {type: weight} map
  n_bootstrap: 200        # cluster bootstrap over test FILES
  ci: 0.95

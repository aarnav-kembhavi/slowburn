# METHOD v4 (DEV only, D60; rule fixed in OPEN_QUESTIONS D60 before this run): soft tail in
# retention only, hard-bound restore that walks back to older kept snapshots only while a deep
# check finds damage. Same seed, machines and grid as the v3 w = 0.75 run it is copied from;
# references on the same machines: hard = method v2 (w 0.75), soft = method v3 at tail 0.02.
seed: 202
experiment: dev_v4_under
output_dir: results/dev_v4_under
split: dev
workers: 5

warmup_days: 14
discovery_delay: [7, 14, 30, 45, 60]
budgets: [4, 6, 8, 12]
reps: 40
vault_calib_machines: 40
policies: [prior_only, slowburn]

# start window: day 28 (two weeks after warm-up) to day 280 (40 weeks)
worlds:
  - {name: uniform, kind: uniform, window: [28, 280]}
  - {name: early, kind: beta, a: 1, b: 3, window: [28, 280]}     # mean day 91
  - {name: late, kind: beta, a: 3, b: 1, window: [28, 280]}      # mean day 217
  # bursty campaigns: centres drawn once from child_rng(202, "bursty_centres") on [40, 268]
  - {name: bursty, kind: clusters, centres: [99, 139, 267], sd: 3, window: [28, 280]}

hp:                              # v1 frozen operating point, unchanged (configs/frozen.yaml)
  p_attack_within_window: 0.05
  prior_window_days: 60
  penalty: 90.0
  restore_quantile: 0.1
  assumed_discovery: {kind: uniform, max_days: 60}
  gate: 0.8
  backbone: 0.25
  null_pool: pooled
  restore_rule: verified
  restore_posterior: discovery
  scan_eps: 0.001

scenario:
  n_files: 40
  file_types: [txt, csv, bin, docx, zip, png, jpg, mp3, zlib, lzma]
  file_kib: [16, 96]
  edits_per_day: 4.0
  attack_start: 112              # used only by calibration machines (attack-free anyway)
  attack_files_per_day: 0.5
  damage_model: striped
  damage_fraction: 0.1

sweep:
  detect_prob: [1.0, 0.5, 0.2, 0.0]
  benign_invalid_rate: [0.01]


variants:
  - {name: hard_M14_w0.75, hp: {assumed_discovery: {kind: uniform, max_days: 14}, blind_weight: 0.75}}
  - {name: soft_M14_tail0.02_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 14, tail: 0.02, alpha: 1.0}, blind_weight: 0.75}}
  - {name: v4_M14_tail0.02_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 14, tail: 0.02, alpha: 1.0}, restore_discovery: {kind: uniform, max_days: 14}, walkback: {alpha: 0.05}, blind_weight: 0.75}}
  - {name: v4_M14_tail0.05_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 14, tail: 0.05, alpha: 1.0}, restore_discovery: {kind: uniform, max_days: 14}, walkback: {alpha: 0.05}, blind_weight: 0.75}}
  - {name: v4_M14_tail0.1_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 14, tail: 0.1, alpha: 1.0}, restore_discovery: {kind: uniform, max_days: 14}, walkback: {alpha: 0.05}, blind_weight: 0.75}}
  - {name: hard_M30_w0.75, hp: {assumed_discovery: {kind: uniform, max_days: 30}, blind_weight: 0.75}}
  - {name: soft_M30_tail0.02_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 30, tail: 0.02, alpha: 1.0}, blind_weight: 0.75}}
  - {name: v4_M30_tail0.02_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 30, tail: 0.02, alpha: 1.0}, restore_discovery: {kind: uniform, max_days: 30}, walkback: {alpha: 0.05}, blind_weight: 0.75}}
  - {name: v4_M30_tail0.05_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 30, tail: 0.05, alpha: 1.0}, restore_discovery: {kind: uniform, max_days: 30}, walkback: {alpha: 0.05}, blind_weight: 0.75}}
  - {name: v4_M30_tail0.1_w0.75, hp: {assumed_discovery: {kind: soft, max_days: 30, tail: 0.1, alpha: 1.0}, restore_discovery: {kind: uniform, max_days: 30}, walkback: {alpha: 0.05}, blind_weight: 0.75}}

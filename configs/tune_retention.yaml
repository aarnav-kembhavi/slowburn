# DEV tuning of retention hyperparameters (pre-registered rule D30) on the full scenario grid.
seed: 101
experiment: tune_retention
output_dir: results/tune_retention_v2
split: dev                # hyperparameters are chosen on DEV only (rule D30)
workers: 5

warmup_days: 14
# PRE-REGISTERED SCENARIO GRID (also recorded in configs/frozen.yaml as scenario_grid):
# budget K x discovery delay x attack-start offset vs the GFS block boundaries.
# attack_start = 112 + o, o in {0, 3, 6, 27}: 112 = 4 x 28 is a monthly AND weekly boundary.
#   o = 0: day s-1 is GFS's weekly and monthly representative (best case for GFS)
#   o = 3: mid-week;  o = 6: the weekly representative is day s itself (worst week position)
#   o = 27: the monthly representative is day s itself (worst month position)
discovery_delay: [7, 14, 30, 45, 60]
budgets: [4, 6, 8, 12]
reps: 10
amoeba_train_machines: 8
vault_calib_machines: 40

hp:
  p_attack_within_window: 0.05
  prior_window_days: 60
  penalty: 90.0
  restore_quantile: 0.1        # quantile-restore ablation only
  assumed_discovery: {kind: uniform, max_days: 60}
  gate: 0.8                    # restore-time posterior gate (D29)
  backbone: 0.25               # Tower of Hanoi backbone fraction (D30)
  null_pool: pooled            # fleet-level benign-rate prior (D31)
  restore_rule: verified
  restore_posterior: discovery  # restore gate conditions on the discovery day (D34)
  scan_eps: 0.001

scenario:
  n_files: 40
  file_types: [txt, csv, bin, docx, zip, png, jpg, mp3, zlib, lzma]
  file_kib: [16, 96]
  edits_per_day: 4.0
  attack_start: 112
  attack_files_per_day: 0.5
  damage_model: striped
  damage_fraction: 0.1

sweep:
  attack_start: [112, 115, 118, 139]
  detect_prob: [1.0, 0.9, 0.5, 0.2, 0.0]
  benign_invalid_rate: [0.0, 0.001, 0.01, 0.05]

tuning:
  stage1:                       # shared restore stage: scored on ALL snapshot baselines
    p_attack_within_window: [0.01, 0.05, 0.2]
    gate: [0.5, 0.8, 0.95]
  stage2:                       # SlowBurn's own knobs, stage-1 values fixed
    penalty: [30.0, 90.0, 270.0]
    assumed_discovery_max_days: [30, 60, 90]
    backbone: [0.0, 0.25, 0.5]

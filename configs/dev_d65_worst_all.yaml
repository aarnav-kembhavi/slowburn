# D65 method v2.1 (OPEN_QUESTIONS D65, committed before this config): verify_snap with the
# significance-based snapshot accept rule (D60 one-sided Beta-Binomial, fleet-pooled prior,
# alpha 0.05). Copied from configs/dev_d64a_worst_all.yaml: same seed, grid and machines.
seed: 202
experiment: dev_d65_worst_all
output_dir: results/dev_d65_worst_all
split: dev
workers: 5

warmup_days: 14
discovery_delay: [7, 14, 30, 45, 60]
budgets: [4, 6, 8, 12]
byte_budgets: [14, 30, 90]
reps: 5
vault_calib_machines: 40
policies: [prior_only, slowburn, gfs, tower_of_hanoi, keep_last_n, oracle]

hp:                              # v1 frozen operating point, unchanged (configs/frozen.yaml)
  p_attack_within_window: 0.05
  prior_window_days: 60
  penalty: 90.0
  restore_quantile: 0.1
  assumed_discovery: {kind: uniform, max_days: 60}
  gate: 0.8
  backbone: 0.25
  null_pool: pooled
  restore_rule: verified
  restore_posterior: discovery
  scan_eps: 0.001

scenario:
  n_files: 40
  file_types: [txt, csv, bin, docx, zip, png, jpg, mp3, zlib, lzma]
  file_kib: [16, 96]
  edits_per_day: 4.0
  attack_start: 112              # used only by calibration machines (attack-free anyway)
  attack_files_per_day: 0.5
  damage_model: striped
  damage_fraction: 0.1

sweep:
  attack_start: [112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132, 133, 134, 135, 136, 137, 138, 139, 140, 141, 142, 143]
  detect_prob: [1.0, 0.5, 0.0]
  benign_invalid_rate: [0.01]

variants:
  - {name: w075_v21, hp: {blind_weight: 0.75, old_flags: verify_snap, snap_accept: {alpha: 0.05}}}

# D74 adaptive attacker (OPEN_QUESTIONS D74), arm 'napierone' bytes, single-machine defences. Scenario,
# detector, hp, variant and calibration copied from configs/dev_d72_bytes_napierone.yaml (post-D71b
# detector). Run: uv run python paper/scripts/d74_run.py <this config>
seed: 202
experiment: test_d74_attack_napierone
output_dir: results/test_d74_attack_napierone
split: test
workers: 5

warmup_days: 14
discovery_delay: [7, 14, 30, 45, 60]
vault_calib_machines: 40        # attack-free DEV machines: fleet null prior, byte multipliers
type_null_priors: true         # D72: per-type benign prior (restore method C)
policies: [shamir_recursive, gfs, tower_of_hanoi, prior_only, slowburn]

# start window: day 28 (two weeks after warm-up) to day 280 (40 weeks)
worlds:
  - {name: uniform, kind: uniform, window: [28, 280]}
  - {name: early, kind: beta, a: 1, b: 3, window: [28, 280]}     # mean day 91
  - {name: late, kind: beta, a: 3, b: 1, window: [28, 280]}      # mean day 217
  # bursty campaigns: centres drawn once from child_rng(202, "bursty_centres") on [40, 268]
  - {name: bursty, kind: clusters, centres: [99, 139, 267], sd: 3, window: [28, 280]}

hp:                              # v1 frozen operating point, unchanged (configs/frozen.yaml)
  p_attack_within_window: 0.05
  prior_window_days: 60
  penalty: 90.0
  restore_quantile: 0.1
  assumed_discovery: {kind: uniform, max_days: 60}
  gate: 0.8
  backbone: 0.25
  null_pool: pooled
  restore_rule: verified
  restore_posterior: discovery
  scan_eps: 0.001

scenario:
  n_files: 40
  file_types: [txt, csv, bin, docx, zip, png, jpg, mp3, zlib]   # D67: no lzma in either arm
  file_kib: [16, 96]
  edits_per_day: 4.0
  attack_start: 112              # used only by calibration machines (attack-free anyway)
  attack_files_per_day: 0.5
  damage_model: striped
  damage_fraction: 0.1
  evidence: detector             # D67: trained detector on bytes; flags = file p <= flag_alpha
  data_source: napierone
  detector_path: results/detector_napierone/detector.pkl
  flag_alpha: 0.01               # the frozen daily-statistic alpha (configs/frozen.yaml)
  napierone_dir: data/napierone
  napierone_pool: v2test         # TEST: v1 sim_test + benign_v2/<type>/test

variants:
  - {name: method_v2_w075_vsnap, hp: {blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true, per_file_cols: {alpha: 0.05}}}

attack:
  arm: napierone_bytes
  rates: [0.25, 0.5, 1, 2, 4]          # files damaged per day (Poisson mean)
  fractions: [0.01, 0.05, 0.1, 0.5, 1.0]  # striped damage fraction
  targets: {all: null, weak4: [csv, bin, txt, jpg], csv: [csv]}
  delays: [7, 14, 30, 45, 60, 90, 120]
  budgets: [4, 8]
  benign_invalid_rate: 0.01
  reps: 10
  selection_reps: [0, 1, 2, 3, 4]      # selection half; reps 5-9 evaluate
  alarm_path: results/dev_d74_alarm_calib/threshold.json   # D74 amendment count alarm

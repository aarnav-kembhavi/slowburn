# D69 (OPEN_QUESTIONS): Bar-On et al. online checkpointing baselines; D63 delay grid machines, every assumed-bound variant
# Count budgets only; verify_snap restore plus oracle-restore columns on every row.
# D63 characterisation sweep for the F1/F2 guideline figure (DEV, descriptive only, nothing
# selected). Method v2 (blind weight 0.75); assumed hard bound M in {7..120} and the soft tail
# (weight 0.1, core M = 60) against true delays 7-120 days; q in {0, 1}; benign 0.01. All four
# budgets are run; the figure uses K = 8. True delay <= M counts as within the bound.
# Restore: the adopted D64a verify_snap pipeline for every policy (D65 rejected; recorded before the run).
seed: 202
experiment: dev_d69_delay_grid
output_dir: results/dev_d69_delay_grid
split: dev
workers: 5

warmup_days: 14
discovery_delay: [7, 14, 30, 60, 90, 120]
budgets: [4, 6, 8, 12]
reps: 40
vault_calib_machines: 40
policies: [prior_only, slowburn, gfs, tower_of_hanoi, shamir_exact, shamir_rr, shamir_recursive]

# start window: day 28 (two weeks after warm-up) to day 280 (40 weeks)
worlds:
  - {name: uniform, kind: uniform, window: [28, 280]}
  - {name: early, kind: beta, a: 1, b: 3, window: [28, 280]}     # mean day 91
  - {name: late, kind: beta, a: 3, b: 1, window: [28, 280]}      # mean day 217
  # bursty campaigns: centres drawn once from child_rng(202, "bursty_centres") on [40, 268]
  - {name: bursty, kind: clusters, centres: [99, 139, 267], sd: 3, window: [28, 280]}

hp:                              # v1 frozen operating point, unchanged (configs/frozen.yaml)
  p_attack_within_window: 0.05
  prior_window_days: 60
  penalty: 90.0
  restore_quantile: 0.1
  assumed_discovery: {kind: uniform, max_days: 60}
  gate: 0.8
  backbone: 0.25
  null_pool: pooled
  restore_rule: verified
  restore_posterior: discovery
  scan_eps: 0.001

scenario:
  n_files: 40
  file_types: [txt, csv, bin, docx, zip, png, jpg, mp3, zlib, lzma]
  file_kib: [16, 96]
  edits_per_day: 4.0
  attack_start: 112              # used only by calibration machines (attack-free anyway)
  attack_files_per_day: 0.5
  damage_model: striped
  damage_fraction: 0.1

sweep:
  detect_prob: [0.0, 1.0]
  benign_invalid_rate: [0.01]


variants:
  - {name: hard_M7, hp: {assumed_discovery: {kind: uniform, max_days: 7}, blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true}}
  - {name: hard_M14, hp: {assumed_discovery: {kind: uniform, max_days: 14}, blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true}}
  - {name: hard_M30, hp: {assumed_discovery: {kind: uniform, max_days: 30}, blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true}}
  - {name: hard_M60, hp: {assumed_discovery: {kind: uniform, max_days: 60}, blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true}}
  - {name: hard_M90, hp: {assumed_discovery: {kind: uniform, max_days: 90}, blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true}}
  - {name: hard_M120, hp: {assumed_discovery: {kind: uniform, max_days: 120}, blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true}}
  - {name: soft_M60_tail0.1, hp: {assumed_discovery: {kind: soft, max_days: 60, tail: 0.1, alpha: 1.0}, blind_weight: 0.75, old_flags: verify_snap, oracle_restore_cols: true}}

# frozen_v2.yaml: DRAFT for the single frozen TEST run. NOT APPROVED.
# TEST runs only after the team (incl. Aarnav) approves this file in writing; until then nothing in
# it is executed and configs/frozen.yaml (the v1 gate) is untouched. Only claims that are in the
# paper are listed. Hyperparameters are the DEV operating point already frozen in
# configs/frozen.yaml (penalty 90, gate 0.8, backbone 0.25, blind weight 0.75, assumed discovery
# uniform up to M = 60, file flag p <= 0.01); nothing is retuned.
status: draft
approved: false
approvals_required: [team, aarnav]
approval_rule: "approved stays false until Aarnav writes in the chat the exact line
  'APPROVED frozen_v2.yaml at commit <hash>'; only then code_commit is re-pinned to <hash>,
  approved: true is committed and the queue below starts"
drafted: 2026-10-26
target: week of 2026-10-29, after approval
code_commit: 5265aab        # TEST content path and scripts; re-pinned to the approved commit before TEST

defaults:
  seed: 202                 # same seed; split "test" gives machine keys disjoint from DEV
  split: test
  napierone_pools:
    content: "TEST: pool version v2test = v1 sim_test files plus benign_v2/<type>/test; never opened"
    damage_families: "sim_test encrypted families (never used on DEV)"
    calibration_content: "DEV (v2): dev-keyed calibration machines of a TEST config keep DEV content,
      so no defender quantity is fitted on TEST files"
    truncated_pngs: "kept, as on DEV (not inspected on TEST)"
  detector: results/detector_napierone/detector.pkl   # unchanged (D78 rejected every fix)
  alarm_c: 3                                            # from DEV calibration; not recalibrated
  restore: verify_snap (A)
  statistics: "paired machine-cluster bootstrap, 2000 resamples, seed 0; Holm within each claim"

prerequisites:            # in this order, before any TEST experiment; no result read
  - id: test_content_path
    status: "done, commit 2bb6985 (not run on TEST)"
    what: "ContentPool(sim_test, v2test) and _napierone(split=test) read v1 sim_test +
      benign_v2/<type>/test with sim_test damage families, only for test-keyed machines and only
      when configs/frozen.yaml has frozen: true AND this file has approved: true"
  - id: test_configs
    status: "done, commit 2a23bc1; check output results/test_configs_check.txt"
    what: "test_*.yaml generated from the DEV configs below by paper/scripts/test_configs.py:
      only split (dev -> test), napierone_pool (v2 -> v2test), experiment and output_dir
      (dev_ -> test_) differ, checked by parsing both"
  - id: registry_gate
    status: "done (gate not loosened); all 9 test configs pass paper/scripts/test_configs.py --check"
    what: "check_split_allowed on test: hyperparameters exact match against configs/frozen.yaml;
      a run with a scenario grid passes only if the SHA-256 of its canonical grid equals its
      experiment's scenario_grids entry below (computed from the DEV config by
      paper/scripts/grid_hashes.py; no entry = refused). Tests: tests/test_f0_infra.py
      test_grid_gate_exact_hash, test_real_test_configs_match_frozen_grids (modified grids fail)"
  - id: inventory
    status: "script written (paper/scripts/test_inventory.py), NOT run"
    what: "count-only TEST pool inventory: files per type, validity failures per type, truncated
      png count, TEST damage families and samples; computed and committed BEFORE any TEST
      experiment. No detector or experiment runs during inventory"
    rule: "inventory changes nothing; no file is removed or added; it is used only to interpret results"
  - id: dry_run
    status: "script written (paper/scripts/test_dry_run.py), NOT run; after inventory"
    what: "each test_*.yaml for 1 test-keyed machine (family dry_run), 1 simulated day, output to a
      scratch dir no analysis script reads; checked only: exit code, that content and damage files
      load from TEST paths, and the config diff script output. Scratch output deleted after the
      check; the deletion is logged (results/test_dry_run.log) as deleted unread"


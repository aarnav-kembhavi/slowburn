failure_rule:
  - "If a TEST job crashes, no partial output is read. Only the crash cause is fixed; the fix is
    committed with the traceback in the commit message; the item is rerun from scratch with
    identical seeds; both attempts are logged in results/test_queue.log"
  - "A fix may not change any config, grid, hyperparameter, metric or analysis script. If it
    would, stop and report"
  - "No item is rerun for any reason other than a crash"

queue:   # after approval only; one heavy job at a time, memory gate measured peak + 4 GB
  order: [inventory, dry_run, ALARM, C2/D72 napierone, D79 napierone, D71, D74 napierone,
    C2/D72 synthetic, D79 synthetic, D74 synthetic, D73 napierone, D73 synthetic]
  analysis: "analysis scripts run only after every item has finished"
  log: results/test_queue.log

items:
  - id: C2
    claim: "SlowBurn vs six baselines (GFS, ToH, Bar-On recursive / round robin, GFS-eqh, ToH-eqh); work lost and recovery"
    dev_config: [configs/dev_d72_bytes_napierone_v2pool.yaml, configs/dev_d72_bytes_synthetic.yaml]
    config_commit: [eb23644, 2b01cda]
    analysis: paper/scripts/d72_c2r_holm.py      # commit ca6c82f
    machines: "4 worlds x 40 reps x 3 benign rates per arm; count budgets K 4 / 6 / 8 / 12; delays 7-60"
    metrics: [clean_recovery, work_lost_whole_system_hours]
    primary_arm: napierone_bytes
    dev_runtime_h: {napierone: 1.2, synthetic: 1.8}
    shares_run_with: D72          # one run per arm gives both C2 and the D72 restore columns
  - id: D72
    claim: "per-file restores (verify_snap, walk-back, changepoint, oracles) under imperfect detection"
    dev_config: same as C2
    analysis: paper/scripts/d72_report.py        # commit 2b01cda
    metrics: [clean_recovery, pf*_work_lost_file_hours, pf*_residual_damaged_files]
    dev_runtime_h: 0             # same run as C2
  - id: D79
    claim: "age-capped SlowBurn vs GFS-eqh (K 12) and ToH-eqh (K 8 / 12); placement does not help at equal horizon"
    dev_config: [configs/dev_d79_eqh_napierone.yaml, configs/dev_d79_eqh_synthetic.yaml]
    config_commit: cd321dd
    analysis: paper/scripts/d79_report.py        # commit e71ad7f
    metrics: [clean_recovery, work_lost_whole_system_hours]
    dev_runtime_h: {napierone: 1.3, synthetic: 1.6}
  - id: D74
    claim: "best-response and realistic attacker recovery vs delay; threshold-aware attacker detection"
    dev_config: [configs/dev_d74_attack_napierone.yaml, configs/dev_d74_attack_synthetic.yaml]
    config_commit: 4d1f075
    analysis: paper/scripts/d74_report.py        # commit b2d8042
    machines: "family d74_attack, 4 worlds x 10 reps per arm; reps 0-4 selection, 5-9 evaluation; 90 strategies x 7 delays"
    metrics: [clean_recovery, pfA_work_lost_file_hours, alarm_delay]
    selection_note: "best-response selection on reps 0 to 4 is the attacker's selection step,
      identical to DEV; it is not tuning of any defender parameter"
    dev_runtime_h: {napierone: 3.7, synthetic: 4.0}   # synthetic DEV took 5.0 h with a duplicate job sharing the CPU
  - id: D74_eqh
    claim: "ToH-eqh at K 8 in the D74 figure"
    note: "DEV showed ToH-eqh at K 8 is the default Tower of Hanoi (base 2), rows identical; it is
      already in the D74 run, so no separate TEST run (results/D74_EQH_REPORT.md)"
    dev_runtime_h: 0
  - id: ALARM
    claim: "count alarm at c = 3: false alarms on 100 benign TEST runs per arm (exact CIs)"
    dev_config: [configs/dev_d74_attack_napierone.yaml, configs/dev_d74_attack_synthetic.yaml]
    analysis: paper/scripts/d74_alarm_holdout.py  # commit b9e15ca; family d74_alarm_test (new key)
    metrics: [per_run_false_alarm, p_day, fleet_false_alarms_per_week]
    dev_runtime_h: 0.25
  - id: D73
    claim: "FLEET (negative finding): per-file work lost down, fleet recovery down"
    dev_config: [configs/dev_d73_fleet_napierone_v2pool.yaml, configs/dev_d73_fleet_synthetic.yaml]
    config_commit: [28edfe9, 91314a6]
    analysis: paper/scripts/d73_report.py        # commit 5fbeeba
    machines: "8 reps x 4 worlds x N {20, 100}; K_avg 4 / 6 / 8"
    metrics: [fleet_clean_A, work_lost_file_hours_A]
    dev_runtime_h: {napierone: 5.0, synthetic: 5.8}
  - id: D71
    claim: "oracle gap: restore diagnostics (held vs restored, per-file oracle ceiling)"
    dev_config: configs/dev_d71_oracle_gap.yaml
    test_config: configs/test_d71_oracle_gap.yaml
    config_commit: bcd61d2
    analysis: paper/scripts/d71_report.py        # commit f41327f
    machines: "4 worlds x 40 reps, abstract evidence; sweep detect_prob {1, 0.9, 0.5, 0.2, 0}
      x benign_invalid_rate {0, 0.01, 0.05}; count budgets K 4 / 6 / 8 / 12; delays 7-60"
    metrics: ["clean_recovery (a verify_snap, b oracle snapshot, c oracle per file)",
      "work_lost_whole_system_hours (a, b)", "per-file work lost hours (a, b, c)",
      "restore diagnosis columns (restore_diag_cols)"]
    dev_runtime_h: 0.5     # DEV machines 12:09 to 12:36 on 2026-10-23, plus calibration

compute:
  basis: "DEV wall-clock of the same configs, one heavy job at a time, 5 workers; TEST pools are the same size"
  per_item_h: {C2_and_D72: 3.0, D79: 2.9, D74: 7.7, D74_eqh: 0, ALARM: 0.25, D73: 10.8, D71: 0.5}
  reports_h: 1.0
  total_h: 26.2
  with_30pct_margin_h: 34
  fits_two_days: true
  if_short_drop_in_order: [D73 synthetic arm (5.8 h), D79 synthetic arm (1.6 h)]

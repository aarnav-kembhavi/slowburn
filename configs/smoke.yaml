# Tiny end-to-end run; must finish in well under a minute on a laptop.
seed: 7
experiment: smoke
output_dir: results/smoke
reps: 2

detector:
  kind: entropy_placeholder

aggregator:
  name: trimmed_mean
  params: {proportion: 0.1}

budget: 7          # max snapshots retained
policies: [keep_last_n]

scenario:
  n_files: 16
  file_kib: [8, 32]
  attack_start: 20
  attack_files_per_day: 0.5
  damage_model: striped
  edits_per_day: 3.0

sweep:
  damage_fraction: [0.05, 0.25, 1.0]
  discovery_delay: [3, 14]

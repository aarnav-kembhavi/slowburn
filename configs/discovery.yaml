# Attack-timing assumptions for the start-day prior.
#
# The prior on the attack start is geometric (constant daily hazard after warm-up), parametrised
# by the probability that an attack starts within a reference window. Agreed sweep:
# P(attack within window) in {0.5%, 1%, 5%, 20%}. The primary value is chosen on DEV machines
# only (never test) and all values are reported.
#
# The discovery delay (days from attack start to discovery) is a SWEPT PARAMETER, not a sourced
# fact. Context values below are placeholders with citation fields; they motivate the sweep range
# and do not drive any result.

start_prior:
  kind: geometric
  window_days: 60                                   # reference window for the probabilities below
  p_attack_within_window: [0.005, 0.01, 0.05, 0.2]
  primary: null                                     # set from dev results (see CHANGELOG)

discovery_delay_days: [3, 7, 14, 21, 30]

context_sources:
  - claim: "median dwell time, intrusion to detection"
    value: null          # TODO(team): fill from the report
    source: "Mandiant M-Trends (year TBD)"
    url: null
  - claim: "median ransomware dwell time"
    value: null
    source: "Sophos Active Adversary Report (year TBD)"
    url: null

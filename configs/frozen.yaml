# Hyperparameters chosen on DEV machines only. Written by slowburn.bench.registry.update_frozen;
# do not hand-edit values. Test-split runs require frozen: true.
frozen: false
params:
  daily_statistic: file_exceed
  daily_statistic_params:
    alpha: 0.01
  observation_model: betabinom
  p_attack_within_window: 0.05
  restore_quantile: 0.1
  penalty: 30.0
  assumed_discovery:
    kind: uniform
    max_days: 60
  budget: 8
  prior_window_days: 60
  scenario_grid:
    budgets:
    - 4
    - 6
    - 8
    - 12
    discovery_delay:
    - 7
    - 14
    - 30
    - 45
    - 60
    attack_start:
    - 112
    - 115
    - 118
    - 139
    detect_prob:
    - 1.0
    - 0.9
    - 0.5
    - 0.2
    - 0.0
    benign_invalid_rate:
    - 0.0
    - 0.001
    - 0.01
    - 0.05
    scenario:
      n_files: 40
      file_types:
      - txt
      - csv
      - bin
      - docx
      - zip
      - png
      - jpg
      - mp3
      - zlib
      - lzma
      file_kib:
      - 16
      - 96
      edits_per_day: 4.0
      attack_files_per_day: 0.5
      damage_model: striped
      damage_fraction: 0.1
    warmup_days: 14
    test_reps: 30
    report: report every cell; per policy the average over cells and the worst cell
      of mean clean recovery and mean whole-system work lost, oracle-ideal work lost
      alongside

[project]
name = "slowburn"
version = "0.1.0"
description = "Changepoint-aware backup retention against slow, intermittent ransomware (defensive research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pillow>=10.0",   # real PNG/JPEG hard negatives
    "lameenc>=1.7",   # real MP3 hard negatives (encodes synthetic audio)
    "pyppmd>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
slowburn = "slowburn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slowburn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["SIM300"]  # flags `T <= x` as a Yoda condition; T is the series length, not a constant

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
